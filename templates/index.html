
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cweb — Shorten a link</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14161C;
    --ink-soft: #565B68;
    --bg: #F2F3F6;
    --surface: #FFFFFF;
    --border: #E1E3EA;
    --accent: #3454D1;
    --accent-ink: #FFFFFF;
    --accent-soft: #EAEEFB;
    --good: #1F9A6C;
    --good-soft: #E7F6EF;
    --bad: #C6432F;
    --bad-soft: #FBEAE6;
    --radius-s: 6px;
    --radius-m: 10px;
    --shadow: 0 1px 2px rgba(20,22,28,0.04), 0 8px 24px -12px rgba(20,22,28,0.12);

    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #EDEEF2;
      --ink-soft: #9BA0AD;
      --bg: #14161C;
      --surface: #1B1E26;
      --border: #2A2D37;
      --accent: #6C8CFF;
      --accent-ink: #10121A;
      --accent-soft: #1E2540;
      --good: #4CC793;
      --good-soft: #17301F;
      --bad: #E2695A;
      --bad-soft: #331B18;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    }
  }

  :root[data-theme="dark"] {
    --ink: #EDEEF2;
    --ink-soft: #9BA0AD;
    --bg: #14161C;
    --surface: #1B1E26;
    --border: #2A2D37;
    --accent: #6C8CFF;
    --accent-ink: #10121A;
    --accent-soft: #1E2540;
    --good: #4CC793;
    --good-soft: #17301F;
    --bad: #E2695A;
    --bad-soft: #331B18;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  html { scroll-padding-top: env(safe-area-inset-top, 0px); }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
    display: flex;
    flex-direction: column;
  }

  .wrap {
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    padding: 0 24px;
  }

  header.top {
    padding-top: calc(28px + env(safe-area-inset-top, 0px));
    padding-bottom: 8px;
  }

  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .mark {
    display: flex;
    align-items: baseline;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: -0.01em;
  }

  .mark .dot { color: var(--accent); }

  .theme-toggle {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink-soft);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .theme-toggle:hover { color: var(--ink); border-color: var(--ink-soft); }
  .theme-toggle svg { width: 16px; height: 16px; }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .hero {
    padding: 40px 0 8px;
  }

  h1 {
    font-size: clamp(30px, 6vw, 42px);
    line-height: 1.08;
    letter-spacing: -0.02em;
    margin: 0 0 10px;
    font-weight: 700;
    max-width: 12ch;
  }

  .sub {
    color: var(--ink-soft);
    font-size: 16px;
    line-height: 1.5;
    margin: 0 0 28px;
    max-width: 46ch;
  }

  form.shorten {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .input-row {
    display: flex;
    gap: 8px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-m);
    padding: 6px;
    box-shadow: var(--shadow);
    transition: border-color 0.15s ease;
  }

  .input-row:focus-within {
    border-color: var(--accent);
  }

  .input-row input {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    outline: none;
    color: var(--ink);
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;
    font-size: 14.5px;
    padding: 12px 10px;
  }

  .input-row input::placeholder { color: var(--ink-soft); opacity: 0.7; }

  button.primary {
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: inherit;
    font-weight: 600;
    font-size: 14.5px;
    padding: 0 20px;
    border-radius: var(--radius-s);
    cursor: pointer;
    white-space: nowrap;
    transition: filter 0.15s ease, transform 0.05s ease;
  }
  button.primary:hover { filter: brightness(1.08); }
  button.primary:active { transform: scale(0.98); }
  button.primary:disabled { opacity: 0.55; cursor: not-allowed; }
  button.primary:focus-visible,
  .theme-toggle:focus-visible,
  .input-row input:focus-visible,
  .copy-btn:focus-visible,
  .hist-item a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .error-msg {
    color: var(--bad);
    font-size: 13px;
    min-height: 16px;
    padding-left: 4px;
  }

  .result {
    margin-top: 6px;
    background: var(--accent-soft);
    border: 1px solid var(--border);
    border-radius: var(--radius-m);
    padding: 16px;
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .result.show { display: flex; }

  .result-link {
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;
    font-size: 15px;
    font-weight: 500;
    color: var(--accent);
    text-decoration: none;
    word-break: break-all;
  }
  .result-link:hover { text-decoration: underline; }

  .copy-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    padding: 8px 12px;
    border-radius: var(--radius-s);
    cursor: pointer;
    flex-shrink: 0;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
  .copy-btn svg { width: 14px; height: 14px; }
  .copy-btn.copied { color: var(--good); border-color: var(--good); }

  .history {
    margin-top: 44px;
    padding-bottom: 40px;
    flex: 1;
  }

  .history-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .history-head h2 {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    margin: 0;
  }

  .clear-btn {
    border: none;
    background: none;
    color: var(--ink-soft);
    font-family: inherit;
    font-size: 12.5px;
    cursor: pointer;
    padding: 2px;
  }
  .clear-btn:hover { color: var(--bad); }

  .hist-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .hist-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-s);
    padding: 12px 14px;
  }

  .hist-item-text { min-width: 0; }

  .hist-item a {
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;
    font-size: 13.5px;
    color: var(--ink);
    text-decoration: none;
    font-weight: 500;
  }
  .hist-item a:hover { color: var(--accent); }

  .hist-item .orig {
    font-size: 12.5px;
    color: var(--ink-soft);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-top: 2px;
  }

  .hist-copy {
    flex-shrink: 0;
    border: none;
    background: none;
    color: var(--ink-soft);
    cursor: pointer;
    padding: 6px;
    display: inline-flex;
    border-radius: var(--radius-s);
  }
  .hist-copy:hover { color: var(--accent); }
  .hist-copy svg { width: 15px; height: 15px; }

  .empty-hint {
    font-size: 13px;
    color: var(--ink-soft);
    padding: 18px 0;
    border-top: 1px dashed var(--border);
  }

  footer {
    padding: 18px 0 calc(24px + env(safe-area-inset-bottom, 0px));
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
    border-top: 1px solid var(--border);
  }

  @media (max-width: 420px) {
    .input-row { flex-direction: column; }
    button.primary { padding: 12px; }
    .wrap { padding: 0 18px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap top-row">
    <div class="mark">cweb<span class="dot">.</span></div>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
      </svg>
    </button>
  </div>
</header>

<main>
  <div class="wrap">
    <section class="hero">
      <h1>Shorten it once. Share it anywhere.</h1>
      <p class="sub">Paste a long URL below and get a short link back in a second — no sign-up required.</p>

      <form class="shorten" id="shortenForm" novalidate>
        <div class="input-row">
          <input
            type="text"
            id="urlInput"
            name="url"
            inputmode="url"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="https://example.com/a/very/long/path?with=params"
            aria-label="Long URL to shorten"
          >
          <button class="primary" type="submit" id="submitBtn">Shorten</button>
        </div>
        <div class="error-msg" id="errorMsg" role="alert"></div>
      </form>

      <div class="result" id="result">
        <a class="result-link" id="resultLink" href="#" target="_blank" rel="noopener"></a>
        <button class="copy-btn" id="copyBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          <span id="copyLabel">Copy</span>
        </button>
      </div>
    </section>

    <section class="history" id="historySection">
      <div class="history-head">
        <h2>Recent links</h2>
        <button class="clear-btn" id="clearBtn" type="button">Clear all</button>
      </div>
      <div class="hist-list" id="histList"></div>
      <p class="empty-hint" id="emptyHint">Shortened links you create will show up here.</p>
    </section>
  </div>
</main>

<footer>
  Front-end template — connect a real shortening API to make links resolve.
</footer>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "snip_history_v1";
  var THEME_KEY = "snip_theme";

  // ---- theme ----
  var root = document.documentElement;
  var themeToggle = document.getElementById("themeToggle");

  function applyTheme(t) {
    if (t === "light" || t === "dark") root.setAttribute("data-theme", t);
    else root.removeAttribute("data-theme");
  }

  try {
    var savedTheme = localStorage.getItem(THEME_KEY);
    if (savedTheme) applyTheme(savedTheme);
  } catch (e) {}

  themeToggle.addEventListener("click", function () {
    var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    var current = root.getAttribute("data-theme") || (prefersDark ? "dark" : "light");
    var next = current === "dark" ? "light" : "dark";
    applyTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  });

  // ---- helpers ----
  function normalizeUrl(raw) {
    var v = raw.trim();
    if (!v) return null;
    if (!/^https?:\/\//i.test(v)) v = "https://" + v;
    try {
      var u = new URL(v);
      if (!u.hostname || u.hostname.indexOf(".") === -1) return null;
      return u.href;
    } catch (e) {
      return null;
    }
  }

  function hashCode(str) {
    var chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    var h1 = 0x811c9dc5;
    for (var i = 0; i < str.length; i++) {
      h1 ^= str.charCodeAt(i);
      h1 = Math.imul(h1, 0x01000193);
    }
    var seed = ((h1 >>> 0) ^ Date.now()) >>> 0;
    var code = "";
    for (var j = 0; j < 6; j++) {
      seed = (Math.imul(seed, 48271) + 1) >>> 0;
      code += chars[seed % chars.length];
    }
    return code;
  }

  function loadHistory() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }

  function saveHistory(list) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch (e) {}
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function copyText(text, btn, labelEl) {
    var done = function (ok) {
      if (!btn) return;
      btn.classList.toggle("copied", ok);
      if (labelEl) labelEl.textContent = ok ? "Copied" : "Copy";
      setTimeout(function () {
        btn.classList.remove("copied");
        if (labelEl) labelEl.textContent = "Copy";
      }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }).catch(function () { done(false); });
    } else {
      try {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        done(true);
      } catch (e) { done(false); }
    }
  }

  // ---- state ----
  var form = document.getElementById("shortenForm");
  var input = document.getElementById("urlInput");
  var errorMsg = document.getElementById("errorMsg");
  var result = document.getElementById("result");
  var resultLink = document.getElementById("resultLink");
  var copyBtn = document.getElementById("copyBtn");
  var copyLabel = document.getElementById("copyLabel");
  var histList = document.getElementById("histList");
  var emptyHint = document.getElementById("emptyHint");
  var clearBtn = document.getElementById("clearBtn");

  var SHORT_DOMAIN = "cweb.io/";
  var currentShort = "";
  var history = loadHistory();

  function renderHistory() {
    histList.innerHTML = "";
    if (!history.length) {
      emptyHint.style.display = "block";
      return;
    }
    emptyHint.style.display = "none";
    history.slice(0, 8).forEach(function (item) {
      var row = document.createElement("div");
      row.className = "hist-item";
      row.innerHTML =
        '<div class="hist-item-text">' +
          '<a href="' + escapeHtml(item.original) + '" target="_blank" rel="noopener">' + SHORT_DOMAIN + escapeHtml(item.code) + '</a>' +
          '<div class="orig">' + escapeHtml(item.original) + '</div>' +
        '</div>' +
        '<button class="hist-copy" type="button" aria-label="Copy link" data-code="' + escapeHtml(item.code) + '">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>' +
        '</button>';
      histList.appendChild(row);
    });

    Array.prototype.forEach.call(histList.querySelectorAll(".hist-copy"), function (btn) {
      btn.addEventListener("click", function () {
        copyText(SHORT_DOMAIN + btn.getAttribute("data-code"), btn, null);
      });
    });
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    errorMsg.textContent = "";
    var normalized = normalizeUrl(input.value);

    if (!input.value.trim()) {
      errorMsg.textContent = "Paste a URL to shorten.";
      input.focus();
      return;
    }
    if (!normalized) {
      errorMsg.textContent = "That doesn't look like a valid URL.";
      input.focus();
      return;
    }

    var code = hashCode(normalized);
    currentShort = SHORT_DOMAIN + code;
    resultLink.textContent = currentShort;
    resultLink.href = normalized;
    result.classList.add("show");

    history.unshift({ code: code, original: normalized, ts: Date.now() });
    history = history.slice(0, 20);
    saveHistory(history);
    renderHistory();

    input.value = "";
  });

  copyBtn.addEventListener("click", function () {
    if (currentShort) copyText(currentShort, copyBtn, copyLabel);
  });

  clearBtn.addEventListener("click", function () {
    history = [];
    saveHistory(history);
    renderHistory();
  });

  renderHistory();
})();
</script>

</body>
</html>
